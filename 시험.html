<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>헬스센터 메인 페이지</title>
<style>
body {
  margin: 0;
  font-family: "Noto Sans KR", sans-serif;
  background: #fff;
  color: #222;
}
.container {
  width: min(1200px, 90%);
  margin: 0 auto;
}
header, section {
  border-bottom: 1px solid #eee;
  padding: 16px 0;
}

header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 1.8rem;
  font-weight: bold;
}
.login-area button {
  border: 1px solid #aaa;
  background: none;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}
.nav {
  display: flex;
  justify-content: center;
  gap: 40px;
  font-size: 1rem;
}
.nav a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}
.nav a:hover {
  color: #007bff;
}

.carousel {
  position: relative;
  width: 100%;
  overflow: hidden;
  margin: 20px auto;
  border-radius: 8px;
}
.track {
  display: flex;
  transition: transform 0.5s ease;
}
.slide {
  min-width: 100%;
}
.slide img {
  width: 100%;
  height: 400px;
  object-fit: cover;
}
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.9);
  border: none;
  cursor: pointer;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.arrow.left { left: 10px; }
.arrow.right { right: 10px; }

.dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #bbb;
  cursor: pointer;
}
.dot.active {
  background: #333;
}

.search-section {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.search-section select,
.search-section input {
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
}
.search-section button {
  padding: 8px 16px;
  background: #007bff;
  border: none;
  border-radius: 4px;
  color: #fff;
  cursor: pointer;
}
.search-section button:hover {
  background: #0056b3;
}

.review-section h2 {
  margin-bottom: 16px;
  font-size: 1.4rem;
}
.reviews {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.review-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  background: #fafafa;
}
.review-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.review-card .content {
  padding: 10px 12px;
}
.review-card h3 {
  margin: 4px 0;
  font-size: 1.1rem;
}
.review-card p {
  font-size: 0.9rem;
  color: #666;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-top">
      <div class="logo">헬스닷컴</div>
      <div class="login-area">
        <button>로그인 / 회원가입</button>
      </div>
    </div>
    <nav class="nav">
      <a href="#">센터찾기</a>
      <a href="#">PT찾기</a>
      <a href="#">가맹찾기</a>
      <a href="#">이벤트</a>
    </nav>
  </div>
</header>

<section>
  <div class="container">
    <div class="carousel" id="carousel">
      <div class="track" id="track">
        <div class="slide"><img src="https://picsum.photos/1200/400?random=1" alt="slide1"></div>
        <div class="slide"><img src="https://picsum.photos/1200/400?random=2" alt="slide2"></div>
        <div class="slide"><img src="https://picsum.photos/1200/400?random=3" alt="slide3"></div>
      </div>
      <button class="arrow left" id="prev">&#10094;</button>
      <button class="arrow right" id="next">&#10095;</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</section>

<section>
  <div class="container search-section">
    <label>센터</label>
    <select>
      <option>지역 선택</option>
      <option>서울</option>
      <option>부산</option>
      <option>대구</option>
    </select>
    <input type="text" placeholder="센터명 검색" />
    <button>검색</button>
  </div>
</section>

<section class="review-section">
  <div class="container">
    <h2>회원들 후기</h2>
    <div class="reviews">
      <div class="review-card">
        <img src="https://picsum.photos/400/200?random=4" alt="후기1" />
        <div class="content">
          <h3>홍길동님 후기</h3>
          <p>센터가 깨끗하고 트레이너가 친절해요!</p>
        </div>
      </div>
      <div class="review-card">
        <img src="https://picsum.photos/400/200?random=5" alt="후기2" />
        <div class="content">
          <h3>김영희님 후기</h3>
          <p>PT 프로그램이 체계적이에요. 추천합니다!</p>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
const track = document.getElementById('track');
const slides = Array.from(track.children);
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const dotsWrap = document.getElementById('dots');
let index = 0;
const total = slides.length;


slides.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.classList.add('dot');
  if (i === 0) dot.classList.add('active');
  dot.addEventListener('click', () => moveToSlide(i));
  dotsWrap.appendChild(dot);
});

function update() {
  track.style.transform = `translateX(${-index * 100}%)`;
  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });
}
function moveToSlide(i) {
  if (i < 0) index = total - 1;
  else if (i >= total) index = 0;
  else index = i;
  update();
}
prev.addEventListener('click', () => moveToSlide(index - 1));
next.addEventListener('click', () => moveToSlide(index + 1));

setInterval(() => moveToSlide(index + 1), 4000);
</script>

</body>
</html>
